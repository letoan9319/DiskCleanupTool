[package]
name = "disk-core"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
trash = "5"
thiserror = "2"
blake3 = "1"
rustc-hash = "2"
memchr = "2"

[target.'cfg(not(windows))'.dependencies]
jwalk = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
] }
