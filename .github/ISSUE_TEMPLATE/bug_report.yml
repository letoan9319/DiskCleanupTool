name: Bug Report
description: Report a bug, scan discrepancy, crash, or UI issue in DiskCleanupTool
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **DiskCleanupTool**! Please fill in the details below so we can reproduce and fix the issue quickly.

  - type: input
    id: version
    attributes:
      label: App Version
      description: Version shown in Settings or the installer filename
      placeholder: "e.g. 0.2.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows Version & Architecture
      description: Run `winver` to check your Windows build
      placeholder: "e.g. Windows 11 24H2 (x64)"
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Scan Engine Used
      options:
        - Auto
        - NTFS MFT (Administrator)
        - Win32 Parallel Walker
        - Unknown / Not applicable
    validations:
      required: true

  - type: dropdown
    id: admin
    attributes:
      label: Running as Administrator?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the issue.
      placeholder: |
        1. Select drive C:\
        2. Switch to ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots, Error Messages, or Logs
      description: Paste any error toast messages or drag-and-drop screenshots here.
    validations:
      required: false
