name: Feature Request
description: Propose a new feature, cleanup analyzer, or UX enhancement for DiskCleanupTool
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **DiskCleanupTool** faster, safer, or more useful? Share it below!

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Scanner / Performance (MFT, Win32 Walker)
        - Folder Tree & Split Treemap UI
        - Global Search
        - Duplicate Finder (BLAKE3)
        - Junk, Dev & WSL2 Cleanup
        - Snapshot & Growth Diff / Export
        - Localization / Themes
        - Windows Shell Integration & Installer
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Describe the workflow bottleneck or cleanup task you want to solve.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you tried any workarounds or seen similar patterns in other tools?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add mockups, screenshots, or technical references if helpful.
    validations:
      required: false
